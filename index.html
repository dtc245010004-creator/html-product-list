<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        td:nth-child(2), td:nth-child(3) {
            text-align: right;
        }
        th:nth-child(2), th:nth-child(3) {
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>28.000.000 VNĐ</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Chuột không dây Logitech</td>
                <td>450.000 VNĐ</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Keychron K2</td>
                <td>1.850.000 VNĐ</td>
                <td>12</td>
            </tr>
            <tr>
                <td>Màn hình LG 27 inch 4K</td>
                <td>8.200.000 VNĐ</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
